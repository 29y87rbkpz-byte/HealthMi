name: Build HealthMi iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project HealthMi.xcodeproj \
            -scheme HealthMi \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package app
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "HealthMi.app")
          zip -r HealthMi.app.zip "$APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-build
          path: HealthMi.app.zip
